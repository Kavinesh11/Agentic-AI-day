[build-system]  
requires = ["setuptools>=45", "wheel"]  
build-backend = "setuptools.build_meta"  
  
[project]  
name = "receipt-processing-system"  
version = "0.1.0"  
description = "AI-powered receipt processing and wallet pass generation system"  
authors = [{name = "Your Name", email = "your.email@example.com"}]  
license = {text = "MIT"}  
readme = "README.md"  
requires-python = ">=3.9"  
  
dependencies = [  
    "fastapi>=0.104.0",  
    "uvicorn>=0.24.0",  
    "pydantic>=2.0.0",  
    "firebase-admin>=6.0.0",  
    "pillow>=10.0.0",  
    "python-multipart>=0.0.6",  
]  
  
[project.optional-dependencies]  
dev = [  
    "pytest>=7.0.0",  
    "pytest-asyncio>=0.21.0",  
    "black>=23.0.0",  
    "isort>=5.12.0",  
    "mypy>=1.0.0",  
]  
  
[tool.setuptools.packages.find]  
where = ["src"]  
  
[tool.black]  
line-length = 88  
target-version = ['py39']  
  
[tool.isort]  
profile = "black"  
src_paths = ["src", "tests"]  
  
[tool.mypy]  
python_version = "3.9"  
strict = true
